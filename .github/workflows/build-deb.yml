name: build-xosvi-deb

permissions:
  contents: write

concurrency:
  group: build-xosvi-deb
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'debsrc/**'
      - 'scripts/build-ipa.sh'
      - 'Support/Info.plist'
      - 'Support/Xosvi.entitlements'
      - '.github/workflows/build-deb.yml'
      - 'Sources/XosviMCP/XosviDaemonClient.swift'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid-procursus xcodegen dpkg >/dev/null 2>&1 || true

      - name: Restore native tools cache
        uses: actions/cache@v4
        with:
          path: native-tools-out
          key: native-tools-v15
          save-always: false

      - name: Build iSH + Alpine rootfs (reused from build-ios)
        run: |
          brew install meson ninja libarchive llvm lld >/dev/null 2>&1 || true
          if [ -d /opt/homebrew/opt/libarchive/lib/pkgconfig ]; then
            export PKG_CONFIG_PATH="/opt/homebrew/opt/libarchive/lib/pkgconfig:$PKG_CONFIG_PATH"
            export LDFLAGS="-L/opt/homebrew/opt/libarchive/lib $LDFLAGS"
            export CPPFLAGS="-I/opt/homebrew/opt/libarchive/include $CPPFLAGS"
          fi
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          mkdir -p ish-stage
          cd ish-stage
          cp ../scripts/ish-build/build_ish.sh .
          cp ../scripts/ish-build/prepare_alpine_rootfs.sh .
          git clone --depth 1 -q -b feature-arm64 https://github.com/OpenMinis/ish-arm64.git ish
          cd ish && git submodule update --init --recursive --depth 1 -q && cd ..
          bash build_ish.sh
          bash prepare_alpine_rootfs.sh
          ls -la libs/ | head -10

      - name: Build iSH sandbox (Sandbox/build)
        run: |
          brew install meson ninja libarchive llvm lld qemu >/dev/null 2>&1 || true
          if [ -d /opt/homebrew/opt/libarchive/lib/pkgconfig ]; then
            export PKG_CONFIG_PATH="/opt/homebrew/opt/libarchive/lib/pkgconfig:$PKG_CONFIG_PATH"
            export LDFLAGS="-L/opt/homebrew/opt/libarchive/lib $LDFLAGS"
            export CPPFLAGS="-I/opt/homebrew/opt/libarchive/include $CPPFLAGS"
            export PATH="/opt/homebrew/opt/libarchive/bin:$PATH"
          fi
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          cd Sandbox
          chmod +x build_ish.sh prepare_alpine_rootfs.sh
          ./build_ish.sh iphoneos
          ./prepare_alpine_rootfs.sh
          bash "$GITHUB_WORKSPACE/scripts/fix-fakefsify-deps.sh"
          test -f build/iphoneos/libish.a || { echo "!! libish.a missing"; exit 1; }
          test -d build/include/ish || { echo "!! ish headers missing"; exit 1; }

      - name: Prepare iSH rootfs zip
        run: |
          cd Sandbox
          brew install libarchive brotli libb2 xz zstd lz4 openssl@3 >/dev/null 2>&1 || true
          if [ ! -x build/fakefsify ]; then
            echo "!! fakefsify missing"; exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/fix-fakefsify-deps.sh"
          export DYLD_LIBRARY_PATH="$PWD/build/lib:$DYLD_LIBRARY_PATH"
          if [ ! -f resources/alpine-rootfs.zip ]; then
            ./prepare_alpine_rootfs.sh
          fi
          cp -f resources/alpine-rootfs.zip Resources/ 2>/dev/null || true
          cp -f resources/libvdso.so.elf Resources/ 2>/dev/null || true
          ls -lh Resources/alpine-rootfs.zip

      - name: Build OpenSSL (MITM kernel)
        run: bash scripts/build-openssl.sh

      - name: Copy native tools to Resources/bin
        run: |
          mkdir -p Resources/bin
          if [ -d native-tools-out ]; then
            for t in lua node r2 cstool jq; do
              [ -f "native-tools-out/$t" ] && cp "native-tools-out/$t" Resources/bin/ || true
            done
          fi
          ls Resources/bin | head -20

      - name: Sanity — deb sources present
        run: |
          set -eu
          for f in debsrc/src/xosvid.c debsrc/src/xosvi-build.c debsrc/src/xosvi-install.c \
                   debsrc/src/xosvi-symbolicate.c debsrc/src/xosvi-cli.c debsrc/src/xosvi_config.h \
                   debsrc/src/xosvi_common.h debsrc/src/xosvi_xpc.h debsrc/DEBIAN/control debsrc/DEBIAN/postinst \
                   debsrc/DEBIAN/prerm debsrc/DEBIAN/postrm \
                   debsrc/Support/helper.entitlements debsrc/Support/cli.entitlements \
                   debsrc/Support/xosvid.entitlements debsrc/scripts/check-adhoc.py; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          python3 -m py_compile debsrc/scripts/check-adhoc.py
          bash -n debsrc/DEBIAN/postinst debsrc/DEBIAN/prerm debsrc/DEBIAN/postrm \
                  debsrc/scripts/build-deb.sh debsrc/scripts/verify-daemon.sh

      - name: Compute version
        run: |
          BASE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist 2>/dev/null || echo "1.0.0")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="${BASE}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
          echo ">>> deb version = $VER"

      - name: Build Xosvi.app (tipa path, reused as deb payload)
        run: |
          export XCODE_APPEX=1
          bash scripts/build-ipa.sh

      - name: Build deb
        run: |
          bash debsrc/scripts/build-deb.sh
          ls -lh xosvi_*.deb

      - name: Inspect deb
        run: |
          DEB=$(ls xosvi_*.deb | head -1)
          dpkg-deb -I "$DEB"
          echo "=== control files ==="
          rm -rf /tmp/ctl && dpkg-deb -e "$DEB" /tmp/ctl && ls -l /tmp/ctl
          echo "=== payload (head) ==="
          dpkg-deb -c "$DEB" | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xosvi-deb
          path: xosvi_*.deb
          if-no-files-found: error

      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB=$(ls xosvi_*.deb | head -1)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$DEB" --clobber
          else
            gh release create latest "$DEB" --title "Xosvi latest" --notes "自动构建（deb）" --latest
          fi
          echo "uploaded: $DEB"

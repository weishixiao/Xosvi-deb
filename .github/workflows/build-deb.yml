# build-deb.yml —— 把已发布的 Xosvi.app 打成越狱 deb。
#
# 设计要点：**不在本工作流里重新构建 App**。
#   · App 由 build-xosvi-ios 产出（iSH / OpenSSL / native-tools / tweaks 全在那条链上，
#     重复一遍既慢又容易与主链漂移）；
#   · 这里只做三件事：取 Xosvi.tipa → 解出 Payload/Xosvi.app → 编译 deb 侧
#     的守护与 helper，打包成 xosvi_<ver>_iphoneos-arm64.deb。
#
# 触发：build-xosvi-ios 成功完成后自动跑；也可手动 workflow_dispatch。
name: build-xosvi-deb

permissions:
  contents: write
  actions: read

concurrency:
  group: build-xosvi-deb
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["build-xosvi-ios"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tipa_url:
        description: '可选：直接指定 Xosvi.tipa 下载地址（留空=用 latest Release）'
        required: false
        default: ''

jobs:
  build-deb:
    # 只在主构建成功时继续；手动触发不受此限
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # 两个显式 checkout：条件表达式在 dispatch 下会被解析成空串，
      # 实测导致检出到上一个提交（构建用旧源码白跑）。分支写死最稳。
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_run'
        with:
          ref: main

      - name: Show checked out revision
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
          git rev-parse HEAD
          git log --oneline -1
          echo "--- 关键源码指纹（便于确认没有跑到旧提交）"
          grep -n 'xosvi_audit_token_pid\|XPC_ERROR_KEY_DESCRIPTION' debsrc/src/xosvi_xpc.h || true

      - name: Install tools
        run: |
          brew install ldid-procursus dpkg >/dev/null 2>&1 || true
          which ldid && dpkg-deb --version | head -1

      - name: Fetch Xosvi.tipa
        env:
          GH_TOKEN: ${{ github.token }}
          TIPA_URL: ${{ github.event.inputs.tipa_url }}
        run: |
          set -eu
          mkdir -p payload
          if [ -n "${TIPA_URL:-}" ]; then
            echo ">>> 用显式地址下载"
            curl -fL --retry 3 -o payload/Xosvi.tipa "$TIPA_URL"
          elif gh release view latest >/dev/null 2>&1; then
            echo ">>> 从 latest Release 取 Xosvi.tipa"
            gh release download latest --pattern 'Xosvi.tipa' --dir payload --clobber
          else
            echo "::error::没有 latest Release，也没有提供 tipa_url"; exit 1
          fi
          ls -lh payload/
          unzip -q payload/Xosvi.tipa -d payload/unpacked
          APP="$(find payload/unpacked -maxdepth 3 -name 'Xosvi.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "::error::tipa 里没有 Xosvi.app"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo ">>> app = $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          ls "$APP" | head -20

      - name: Sanity — deb sources present
        run: |
          set -eu
          for f in debsrc/src/xosvid.c debsrc/src/xosvi-build.c debsrc/src/xosvi-install.c \
                   debsrc/src/xosvi-symbolicate.c debsrc/src/xosvi-cli.c \
                   debsrc/src/xosvi_config.h debsrc/src/xosvi_common.h debsrc/src/xosvi_xpc.h \
                   debsrc/DEBIAN/control debsrc/DEBIAN/postinst debsrc/DEBIAN/prerm \
                   debsrc/DEBIAN/postrm debsrc/Support/helper.entitlements \
                   debsrc/Support/cli.entitlements debsrc/Support/xosvid.entitlements \
                   debsrc/scripts/check-adhoc.py; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          python3 -m py_compile debsrc/scripts/check-adhoc.py
          bash -n debsrc/DEBIAN/postinst debsrc/DEBIAN/prerm debsrc/DEBIAN/postrm \
                  debsrc/scripts/build-deb.sh debsrc/scripts/verify-daemon.sh

      - name: Compute version
        run: |
          BASE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null || echo "1.0.0")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="${BASE}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
          echo ">>> deb version = $VER"

      - name: Build deb (roothide + rootless)
        run: |
          APP_SRC="$APP" bash debsrc/scripts/build-deb.sh
          ls -lh xosvi_*.deb

      - name: Inspect deb
        run: |
          for DEB in xosvi_*.deb; do
            echo "=================== $DEB"
            dpkg-deb -I "$DEB" | sed -n '1,12p'
            echo "--- 关键项"
            dpkg-deb -c "$DEB" | grep -E 'xosvid|xosvi-cli|LaunchDaemons|Xosvi.app/Xosvi$' | head -8
          done
          DEB=$(ls xosvi_*arm64e.deb 2>/dev/null | head -1); DEB=${DEB:-$(ls xosvi_*.deb|head -1)}
          dpkg-deb -I "$DEB"
          true
          echo "=== control files ==="
          rm -rf /tmp/ctl && dpkg-deb -e "$DEB" /tmp/ctl && ls -l /tmp/ctl
          echo "=== payload ==="
          dpkg-deb -c "$DEB" | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xosvi-deb
          path: xosvi_*.deb
          if-no-files-found: error

      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest xosvi_*.deb --clobber
            gh release edit latest --notes "自动构建（deb）：iphoneos-arm64e = roothide，iphoneos-arm64 = rootless。按设备 bootstrap 选一个装。"
          else
            gh release create latest xosvi_*.deb --title "Xosvi latest" \
              --notes "自动构建（deb）：iphoneos-arm64e = roothide，iphoneos-arm64 = rootless。" --latest
          fi
          ls -lh xosvi_*.deb
